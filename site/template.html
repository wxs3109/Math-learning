<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math learning 笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 布局：顶栏 + 左侧导航 + 中间正文（约 65 个汉字宽）+ 右侧本页目录；窄屏时导航收进抽屉、目录隐藏 */
:root {
  --bg: #f7f7f4;          /* 纸面 */
  --surface: #efeee8;     /* 侧栏、代码块 */
  --ink: #1c2230;         /* 正文 */
  --muted: #5d6573;       /* 次要文字 */
  --accent: #2d5b8c;      /* 钢蓝：链接、当前项 */
  --rule: #dcd9cf;        /* 分隔线 */
  --mark: #f3e2a8;        /* 搜索高亮 */
  --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --hl-kw: #8a3b6f; --hl-str: #3d6b2c; --hl-num: #a05a12; --hl-com: #7c8290; --hl-fn: #2d5b8c;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13161b; --surface: #1b1f26; --ink: #e2e5ea; --muted: #9aa2ae; --accent: #82b2e3;
    --rule: #2b3039; --mark: #5a4a17;
    --hl-kw: #d59ad0; --hl-str: #9fcf85; --hl-num: #e6b673; --hl-com: #7f8794; --hl-fn: #82b2e3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13161b; --surface: #1b1f26; --ink: #e2e5ea; --muted: #9aa2ae; --accent: #82b2e3;
  --rule: #2b3039; --mark: #5a4a17;
  --hl-kw: #d59ad0; --hl-str: #9fcf85; --hl-num: #e6b673; --hl-com: #7f8794; --hl-fn: #82b2e3;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.75; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr) 220px; grid-template-rows: auto 1fr; height: 100%; }
header.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-bottom: 1px solid var(--rule); background: var(--bg); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--ink); white-space: nowrap; }
.brand small { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; }
.search { flex: 1; max-width: 420px; margin-left: auto; position: relative; }
.search input { width: 100%; padding: 7px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; }
.menu-btn { display: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 14px; cursor: pointer; }

nav.side { overflow-y: auto; border-right: 1px solid var(--rule); background: var(--surface); padding: 16px 0 32px; }
.nav-group { padding: 0 12px 14px; }
.nav-group h2, .nav-group summary { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--muted); margin: 0 0 4px; padding: 4px 8px; cursor: default; }
.nav-group summary { cursor: pointer; list-style: none; }
.nav-group summary::-webkit-details-marker { display: none; }
.nav-group summary::before { content: "▸ "; }
.nav-group details[open] summary::before { content: "▾ "; }
.nav-link { display: block; padding: 4px 8px; border-radius: 5px; color: var(--ink); font-size: 14px; line-height: 1.5; }
.nav-link:hover { background: var(--bg); text-decoration: none; }
.nav-link[aria-current="page"] { background: var(--bg); color: var(--accent); font-weight: 500; box-shadow: inset 3px 0 0 var(--accent); }
.nav-link.code { font-family: var(--font-mono); font-size: 12.5px; }

.results { padding: 0 12px; }
.results h2 { font-size: 12px; color: var(--muted); margin: 0 0 8px; padding: 0 8px; }
.result { display: block; padding: 8px; border-radius: 6px; color: var(--ink); font-size: 13.5px; line-height: 1.55; }
.result:hover { background: var(--bg); text-decoration: none; }
.result b { display: block; color: var(--accent); font-weight: 500; }
.result span { color: var(--muted); }
.result mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }

main { overflow-y: auto; padding: 32px 40px 80px; }
.doc { max-width: 46rem; margin: 0 auto; }
.doc h1, .doc h2, .doc h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.35; }
.doc h1 { font-size: 30px; margin: 0 0 16px; }
.doc h1 code { font-family: var(--font-mono); font-size: 24px; background: none; padding: 0; }
.doc h2 { font-size: 22px; margin: 40px 0 12px; padding-top: 16px; border-top: 1px solid var(--rule); }
.doc h3 { font-size: 18px; margin: 28px 0 8px; }
.doc p, .doc li { text-wrap: pretty; }
.doc ul, .doc ol { padding-left: 1.4em; }
.doc li { margin: 2px 0; }
.doc hr { display: none; }
.doc blockquote { margin: 0 0 24px; padding: 10px 16px; border-left: 3px solid var(--accent); background: var(--surface); color: var(--muted); font-size: 14px; border-radius: 0 6px 6px 0; }
.doc blockquote p { margin: 4px 0; }
.doc code { font-family: var(--font-mono); font-size: .88em; background: var(--surface); padding: 1px 5px; border-radius: 4px; }
.doc pre { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; overflow-x: auto; line-height: 1.55; font-size: 13.5px; }
.doc pre code { background: none; padding: 0; font-size: inherit; }
.table-wrap { overflow-x: auto; margin: 16px 0; }
.doc table { border-collapse: collapse; font-size: 14.5px; font-variant-numeric: tabular-nums; min-width: 60%; }
.doc th, .doc td { border-bottom: 1px solid var(--rule); padding: 6px 12px; text-align: left; vertical-align: top; }
.doc th { font-weight: 700; border-bottom: 2px solid var(--rule); }
.doc mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
.doc strong { font-weight: 700; }
.code-meta { color: var(--muted); font-size: 14px; margin: 0 0 8px; }

.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--rule); }
.pager a { display: flex; flex-direction: column; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 8px; max-width: 48%; }
.pager a:hover { border-color: var(--accent); text-decoration: none; }
.pager small { color: var(--muted); font-size: 12px; }
.pager .next { margin-left: auto; text-align: right; }

aside.toc { overflow-y: auto; padding: 32px 16px; border-left: 1px solid var(--rule); font-size: 13px; }
aside.toc h2 { font-size: 12px; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
aside.toc a { display: block; color: var(--muted); padding: 3px 0; line-height: 1.45; }
aside.toc a.l3 { padding-left: 12px; }
aside.toc a:hover { color: var(--accent); text-decoration: none; }

/* highlight.js 配色（用主题色） */
.hljs-keyword, .hljs-built_in, .hljs-literal { color: var(--hl-kw); }
.hljs-string, .hljs-doctag { color: var(--hl-str); }
.hljs-number { color: var(--hl-num); }
.hljs-comment { color: var(--hl-com); font-style: italic; }
.hljs-title, .hljs-title.function_ { color: var(--hl-fn); }

@media (max-width: 1180px) { .shell { grid-template-columns: 256px minmax(0, 1fr); } aside.toc { display: none; } }
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-block; }
  nav.side { position: fixed; top: 53px; left: 0; bottom: 0; width: 82%; max-width: 300px; z-index: 5; transform: translateX(-100%); transition: transform .2s; }
  body.nav-open nav.side { transform: none; box-shadow: 4px 0 20px rgba(0,0,0,.15); }
  main { padding: 20px 16px 64px; }
  .brand small { display: none; }
  .doc h1 { font-size: 25px; }
}
@media (prefers-reduced-motion: reduce) { nav.side { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <button class="menu-btn" id="menu-btn" type="button" aria-label="打开目录">目录</button>
    <a class="brand" href="#home">Math learning<small>学习与研究笔记</small></a>
    <div class="search">
      <input id="search-input" type="search" placeholder="搜索全部笔记和代码" aria-label="搜索全部笔记和代码" autocomplete="off">
    </div>
  </header>
  <nav class="side" id="side" aria-label="站点导航"></nav>
  <main id="main">
<!--__ARTICLES__-->
    <div class="doc"><nav class="pager" id="pager" aria-label="上一篇和下一篇"></nav></div>
  </main>
  <aside class="toc" id="toc" aria-label="本页目录"></aside>
</div>

<script>
window.MathJax = {
  tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]], processEscapes: true },
  svg: { fontCache: "global" },
  startup: { typeset: false }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const META = /*__META__*/;
const SEARCH = /*__SEARCH__*/;
const SERIES = /*__SERIES__*/;
const byId = Object.fromEntries(META.map(m => [m.id, m]));
const side = document.getElementById("side");
const main = document.getElementById("main");
const toc = document.getElementById("toc");
const pager = document.getElementById("pager");
const input = document.getElementById("search-input");
const done = new Set();   // 已经排版过公式、高亮过代码的页面

/* ---------- 侧栏导航 ---------- */
function buildNav() {
  const groups = [];
  for (const m of META) {
    let g = groups.find(x => x.name === m.group);
    if (!g) groups.push(g = { name: m.group, items: [] });
    g.items.push(m);
  }
  side.innerHTML = groups.map(g => {
    const links = g.items.map(m =>
      `<a class="nav-link${g.name === "代码" ? " code" : ""}" href="#${m.id}" data-id="${m.id}">${esc(m.short)}</a>`).join("");
    if (g.name === "代码")
      return `<div class="nav-group"><details id="code-group"><summary>代码（${g.items.length}）</summary>${links}</details></div>`;
    return `<div class="nav-group"><h2>${esc(g.name)}</h2>${links}</div>`;
  }).join("");
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

/* ---------- 切换页面 ---------- */
function show(id) {
  if (!byId[id]) id = "home";
  document.querySelectorAll("article.doc").forEach(a => a.hidden = a.dataset.page !== id);
  document.querySelectorAll(".nav-link").forEach(a =>
    a.dataset.id === id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const cg = document.getElementById("code-group");
  if (cg && byId[id].group === "代码") cg.open = true;
  const art = document.getElementById("page-" + id);
  if (!done.has(id)) {
    done.add(id);
    if (window.hljs) art.querySelectorAll("pre code").forEach(el => hljs.highlightElement(el));
    if (window.MathJax && MathJax.startup && MathJax.startup.promise)
      MathJax.startup.promise.then(() => MathJax.typesetPromise([art])).catch(() => {});
  }
  buildToc(art);
  buildPager(id);
  document.title = byId[id].short + " · Math learning 笔记";
  main.scrollTop = 0;
  document.body.classList.remove("nav-open");
}
function current() { const h = location.hash.slice(1); return byId[h] ? h : "home"; }

/* ---------- 本页目录（点击滚动，不改地址） ---------- */
// 标题里的公式在目录中显示成去掉定界符的源码，例如 \(p-y\) → p-y
function tocText(h) { return h.textContent.replace(/\\\(|\\\)/g, "").replace(/\s+/g, " ").trim(); }
function buildToc(art) {
  const hs = [...art.querySelectorAll("h2, h3")];
  if (!hs.length) { toc.innerHTML = ""; return; }
  toc.innerHTML = "<h2>本页目录</h2>" + hs.map((h, i) =>
    `<a href="#" class="l${h.tagName[1]}" data-i="${i}">${esc(tocText(h))}</a>`).join("");
  toc.onclick = e => {
    const a = e.target.closest("a"); if (!a) return;
    e.preventDefault(); hs[+a.dataset.i].scrollIntoView({ block: "start" });
  };
}

/* ---------- 上一篇 / 下一篇 ---------- */
function buildPager(id) {
  const i = SERIES.indexOf(id);
  if (i < 0) { pager.innerHTML = ""; pager.parentElement.hidden = true; return; }
  pager.parentElement.hidden = false;
  const prev = SERIES[i - 1], next = SERIES[i + 1];
  pager.innerHTML =
    (prev ? `<a class="prev" href="#${prev}"><small>上一篇</small>${esc(byId[prev].short)}</a>` : "") +
    (next ? `<a class="next" href="#${next}"><small>下一篇</small>${esc(byId[next].short)}</a>` : "");
}

/* ---------- 全文搜索 ---------- */
function search(q) {
  q = q.trim();
  if (!q) { buildNav(); show(current()); return; }
  const ql = q.toLowerCase(), hits = [];
  for (const s of SEARCH) {
    const t = s.text, tl = t.toLowerCase();
    let n = 0, pos = tl.indexOf(ql), first = pos;
    while (pos >= 0) { n++; pos = tl.indexOf(ql, pos + ql.length); }
    const titleHit = byId[s.id].short.toLowerCase().includes(ql) || byId[s.id].title.toLowerCase().includes(ql);
    if (n || titleHit) {
      const a = Math.max(0, first - 30), snip = first >= 0 ? t.slice(a, first + ql.length + 50) : "";
      hits.push({ id: s.id, n, titleHit, snip, at: first - a });
    }
  }
  hits.sort((x, y) => (y.titleHit - x.titleHit) || (y.n - x.n));
  side.innerHTML = `<div class="results"><h2>${hits.length ? `找到 ${hits.length} 个页面` : "没有找到匹配的内容"}</h2>` +
    hits.map(h => {
      const s = h.snip ? esc(h.snip.slice(0, h.at)) + "<mark>" + esc(h.snip.slice(h.at, h.at + q.length)) + "</mark>" + esc(h.snip.slice(h.at + q.length)) : "";
      return `<a class="result" href="#${h.id}"><b>${esc(byId[h.id].short)}</b><span>${h.n ? h.n + " 处 · " : ""}…${s}…</span></a>`;
    }).join("") + "</div>";
}
input.addEventListener("input", () => search(input.value));
side.addEventListener("click", e => {
  if (e.target.closest(".result")) { input.value = ""; setTimeout(() => { buildNav(); show(current()); }, 0); }
});

document.getElementById("menu-btn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
window.addEventListener("hashchange", () => show(current()));
buildNav();
show(current());
</script>
</body>
</html>
