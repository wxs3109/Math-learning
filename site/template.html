<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大模型原理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*__KATEX_CSS__*/</style>
<style>
/* 版式：左侧深色导航栏 | 正文一栏（约 40 个汉字宽）| 右侧本页目录。唯一的强调：二级标题前的朱红"印章"编号 */
:root {
  --paper: #fbfbfa;        /* 正文底色 */
  --ink: #161c28;          /* 正文 */
  --muted: #586172;        /* 次要文字 */
  --rule: #e2e4e8;         /* 分隔线、边框 */
  --wash: #f1f2f4;         /* 行内代码、表头、引用 */
  --panel: #111a2b;        /* 侧栏、代码块 */
  --accent: #cf3b25;       /* 朱红 */
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --panel-ink: #c9d1de; --panel-muted: #7b879b; --panel-hover: #1b2639; --panel-rule: #243049;
  --callout: #fff5dc; --callout-bar: #d99a0b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e131c; --ink: #e4e7ed; --muted: #9ba4b4; --rule: #252d3a; --wash: #171e2a;
    --panel: #090d15; --accent: #ff6a50; --panel-hover: #141c2a; --panel-rule: #1c2536;
    --callout: #2b2312; --callout-bar: #d99a0b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e131c; --ink: #e4e7ed; --muted: #9ba4b4; --rule: #252d3a; --wash: #171e2a;
  --panel: #090d15; --accent: #ff6a50; --panel-hover: #141c2a; --panel-rule: #1c2536;
  --callout: #2b2312; --callout-bar: #d99a0b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.8; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.shell { display: grid; grid-template-columns: 284px minmax(0, 1fr); height: 100%; }

/* ---------------- 侧栏：书的目录（部分 → 章 → 节） ---------------- */
.side { background: var(--panel); color: var(--panel-ink); display: flex; flex-direction: column; min-height: 0; }
.brand { display: block; padding: 26px 24px 18px; color: #fff; }
.brand:hover { text-decoration: none; }
.brand b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 23px; letter-spacing: .02em; line-height: 1.2; }
.brand span { font-size: 12.5px; color: var(--panel-muted); }
.search { padding: 0 18px 10px; }
.search input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--panel-rule); background: var(--panel-hover); color: #fff; font: inherit; font-size: 14px; }
.search input::placeholder { color: var(--panel-muted); }
.nav { overflow-y: auto; padding: 4px 10px 40px; flex: 1; }
.nav-top { display: block; margin: 8px 0 2px; padding: 7px 12px; border-radius: 7px; color: var(--panel-ink); font-size: 14.5px; }
.nav-top:hover { background: var(--panel-hover); color: #fff; text-decoration: none; }
.nav-top[aria-current="page"] { background: var(--panel-hover); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.part-label { margin: 22px 12px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .12em; color: var(--panel-muted); }
.chap-row { display: flex; align-items: stretch; border-radius: 7px; }
.chap-row:hover { background: var(--panel-hover); }
.chap.current > .chap-row { background: var(--panel-hover); box-shadow: inset 3px 0 0 var(--accent); }
.chap-link { flex: 1; display: flex; gap: 10px; align-items: baseline; padding: 7px 4px 7px 12px; color: var(--panel-ink); font-size: 14.5px; line-height: 1.45; min-width: 0; }
.chap-link:hover { text-decoration: none; color: #fff; }
.chap.current .chap-link { color: #fff; font-weight: 500; }
.chap-num { flex: none; width: 1.3em; font-family: var(--font-mono); font-size: 13px; color: var(--accent); text-align: right; }
.chap-toggle { flex: none; width: 34px; border: 0; background: none; color: var(--panel-muted); cursor: pointer; border-radius: 7px; font-size: 12px; }
.chap-toggle:hover { color: #fff; }
.chap-toggle::before { content: "▸"; display: inline-block; transition: transform .15s; }
.chap.open > .chap-row .chap-toggle::before { transform: rotate(90deg); }
.secs { display: none; margin: 2px 0 8px; padding: 0 0 0 33px; list-style: none; }
.chap.open > .secs { display: block; }
.sec-link { display: flex; gap: 8px; padding: 4px 10px 4px 10px; border-left: 1px solid var(--panel-rule); color: var(--panel-muted); font-size: 13px; line-height: 1.5; }
.sec-link:hover { color: #fff; text-decoration: none; }
.sec-link.active { color: #fff; border-left: 2px solid var(--accent); padding-left: 9px; }
.sec-num { flex: none; min-width: 2.2em; font-family: var(--font-mono); font-size: 12px; }
.sec-link.code { font-family: var(--font-mono); font-size: 12px; }
.chap.planned .chap-link { color: var(--panel-muted); cursor: default; }
.chap.planned .chap-num { color: var(--panel-muted); }
.chap.planned .soon { margin-left: auto; font-size: 11px; padding: 0 7px; border: 1px solid var(--panel-rule); border-radius: 999px; color: var(--panel-muted); }
.result { display: block; padding: 9px 12px; border-radius: 7px; color: var(--panel-ink); font-size: 13px; line-height: 1.55; }
.result:hover { background: var(--panel-hover); text-decoration: none; }
.result b { display: block; color: #fff; font-weight: 500; font-size: 14px; }
.result mark { background: var(--accent); color: #fff; padding: 0 2px; border-radius: 2px; }

/* ---------------- 主区 ---------------- */
.main { overflow-y: auto; min-height: 0; }
.mobile-bar { display: none; }
.layout { max-width: 46rem; margin: 0 auto; padding: 56px 40px 120px; }

/* ---------------- 页头 ---------------- */
.eyebrow { margin: 0 0 12px; font-size: 13px; font-weight: 500; letter-spacing: .08em; color: var(--muted); }
.eyebrow span { color: var(--accent); font-weight: 700; margin-right: 12px; }
.page-head { padding-bottom: 28px; margin-bottom: 8px; border-bottom: 1px solid var(--rule); }
.page-head h1 { font-family: var(--font-display); font-weight: 900; font-size: 44px; line-height: 1.22; margin: 0 0 14px; text-wrap: balance; letter-spacing: .01em; }
.page-head h1 code { font-family: var(--font-mono); font-weight: 500; font-size: 32px; }
.dek { font-size: 18px; line-height: 1.7; color: var(--muted); margin: 0 0 14px; max-width: 38em; }
.meta-line { margin: 2px 0; font-size: 13px; color: var(--muted); }
.meta-line .tag { margin-left: 0; margin-right: 2px; }

/* ---------------- 正文 ---------------- */
.prose { font-size: 16.5px; }
.prose p { margin: 0 0 16px; text-wrap: pretty; }
.prose h2 { display: flex; align-items: baseline; gap: 14px; margin: 64px 0 20px; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.35; text-wrap: balance; }
.prose h2:first-child { margin-top: 36px; }
.secnum { flex: none; color: var(--accent); font-family: var(--font-display); font-weight: 900; }
.prose h2 { scroll-margin-top: 24px; }
.prose h2.plain { color: var(--ink); }
.prose h3 { scroll-margin-top: 24px; }
.prose h3 .secnum { font-family: var(--font-mono); font-weight: 500; font-size: 14px; margin-right: 10px; }
.prose h3 { margin: 40px 0 12px; font-family: var(--font-display); font-weight: 700; font-size: 19.5px; line-height: 1.45; text-wrap: balance; }
.prose ul, .prose ol { margin: 0 0 16px; padding-left: 1.5em; }
.prose li { margin: 4px 0; }
.prose li > p { margin: 0 0 6px; }
.prose ul > li::marker { color: var(--accent); }
.prose ol > li::marker { color: var(--muted); font-weight: 500; }
.prose strong { font-weight: 700; }
.prose blockquote { margin: 20px 0; padding: 14px 18px; background: var(--wash); border-radius: 10px; color: var(--muted); font-size: 15px; }
.prose blockquote p:last-child { margin-bottom: 0; }
.prose blockquote.callout { background: var(--callout); color: var(--ink); box-shadow: inset 3px 0 0 var(--callout-bar); }
.prose blockquote.callout::before { content: "更正"; display: block; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--callout-bar); margin-bottom: 4px; }
.prose code { font-family: var(--font-mono); font-size: .86em; background: var(--wash); padding: 1px 6px; border-radius: 5px; }
.prose a code { color: var(--accent); }

.tag { display: inline-block; margin-left: 8px; padding: 1px 9px; border-radius: 999px; font-family: var(--font-body); font-size: 12px; font-weight: 500; line-height: 1.7; vertical-align: 3px; letter-spacing: .02em; white-space: nowrap; }
.tag-proved { background: #e3f3e7; color: #1d6a38; }
.tag-fact { background: #e6edf8; color: #2b4e86; }
.tag-intuition { background: #fdf1d3; color: #855700; }
.tag-conjecture { background: #efe6fa; color: #66399c; }
.tag-verify { background: #fbe4df; color: #a2311d; }
.tag-numeric { background: #def2f1; color: #1b6767; }
.tag-practice { background: #fde8f1; color: #9b2c5e; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag { background: rgba(255,255,255,.08); color: var(--ink); } }
:root[data-theme="dark"] .tag { background: rgba(255,255,255,.08); color: var(--ink); }

.katex { font-size: 1.07em; }
.katex-display { margin: 22px 0; padding: 4px 0; overflow-x: auto; overflow-y: hidden; }
.math-error { color: var(--accent); }
.nobr { white-space: nowrap; }

.table-wrap { margin: 20px 0 24px; overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; }
.prose table { border-collapse: collapse; width: 100%; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.prose th { background: var(--wash); text-align: left; font-size: 13px; font-weight: 700; color: var(--muted); padding: 10px 14px; white-space: nowrap; }
.prose td { padding: 9px 14px; border-top: 1px solid var(--rule); vertical-align: top; }

.prose pre { position: relative; margin: 20px 0 24px; padding: 40px 22px 20px; background: var(--panel); color: #d9e1ee; border-radius: 12px; overflow-x: auto; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.65; }
.prose pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
.pre-label { position: absolute; top: 12px; left: 22px; font-size: 11.5px; letter-spacing: .08em; color: var(--panel-muted); font-family: var(--font-mono); }
/* Pygments 配色（代码块总是深色底） */
.code .k, .code .kn, .code .kd, .code .kc, .code .kr, .code .ow { color: #ff9b80; }
.code .s, .code .s1, .code .s2, .code .sa, .code .se, .code .si { color: #a9d8a2; }
.code .sd { color: #8fbf89; }
.code .c, .code .c1, .code .cm, .code .ch { color: #6f7d95; font-style: italic; }
.code .m, .code .mi, .code .mf { color: #f3c47a; }
.code .nf, .code .fm, .code .nc { color: #8cb6f5; }
.code .nb, .code .bp { color: #c6a8fa; }
.code .o { color: #b9c3d3; }

/* ---------------- 上一篇 / 下一篇 ---------------- */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 72px; }
.pager:empty { display: none; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; border: 1px solid var(--rule); border-radius: 12px; color: var(--ink); }
.pager a:hover { border-color: var(--accent); text-decoration: none; }
.pager small { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.pager b { font-family: var(--font-display); font-size: 17px; }
.pager .next { grid-column: 2; text-align: right; }

/* ---------------- 封面与目录 ---------------- */
.cover { padding: 24px 0 36px; border-bottom: 1px solid var(--rule); margin-bottom: 28px; }
.cover h1 { font-family: var(--font-display); font-weight: 900; font-size: 64px; line-height: 1.05; margin: 0 0 20px; letter-spacing: .02em; }
.cover .dek { font-size: 18.5px; }
.contents-title { font-family: var(--font-display); font-weight: 900; font-size: 30px; margin: 56px 0 4px; }
.toc-part { margin-top: 32px; }
.part-title { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--muted); margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
.toc-chaps { list-style: none; margin: 0; padding: 0; }
.toc-chap { padding: 14px 0 16px; border-bottom: 1px dashed var(--rule); }
.toc-chap-head { display: flex; align-items: baseline; gap: 14px; color: var(--ink); }
a.toc-chap-head:hover { text-decoration: none; color: var(--accent); }
.toc-chap-num { flex: none; width: 1.6em; font-family: var(--font-display); font-weight: 900; font-size: 24px; color: var(--accent); }
.toc-chap-title { font-family: var(--font-display); font-weight: 700; font-size: 21px; }
.toc-dek { margin: 2px 0 8px 52px; color: var(--muted); font-size: 14px; }
.toc-secs { list-style: none; margin: 0 0 0 52px; padding: 0; columns: 2; column-gap: 28px; font-size: 14px; }
.toc-secs li { break-inside: avoid; }
.toc-secs a { display: flex; gap: 8px; padding: 2px 0; color: var(--ink); }
.toc-secs a:hover { color: var(--accent); text-decoration: none; }
.toc-num { flex: none; min-width: 2.4em; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); padding-top: 1px; }
.code-list code { font-family: var(--font-mono); font-size: 12.5px; }
.toc-chap.planned .toc-chap-num, .toc-chap.planned .toc-chap-title { color: var(--muted); }
.status { margin-left: 4px; font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--wash); color: var(--muted); align-self: center; }

/* ---------------- 窄屏 ---------------- */
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: 86%; max-width: 320px; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
  body.nav-open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  .mobile-bar { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; padding: 10px 16px; background: var(--panel); color: #fff; }
  .mobile-bar button { border: 1px solid var(--panel-rule); background: var(--panel-hover); color: #fff; border-radius: 7px; padding: 4px 12px; font: inherit; font-size: 14px; }
  .mobile-bar b { font-family: var(--font-display); font-weight: 900; }
  .layout { padding: 28px 18px 80px; }
  .page-head h1 { font-size: 30px; }
  .cover h1 { font-size: 44px; }
  .toc-secs { columns: 1; }
  .prose h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .side, .chap-toggle::before { transition: none; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="全书目录">
    <a class="brand" href="#home"><b>大模型原理</b><span>从数学基础到工程实践</span></a>
    <div class="search"><input id="search-input" type="search" placeholder="搜索全书和代码" aria-label="搜索全书和代码" autocomplete="off"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main" id="main">
    <div class="mobile-bar"><button type="button" id="menu-btn">目录</button><b>大模型原理</b></div>
    <div class="layout">
<!--__ARTICLES__-->
      <nav class="pager" id="pager" aria-label="上一章和下一章"></nav>
    </div>
  </div>
</div>
<script>
const META = /*__META__*/;
const NAV = /*__NAV__*/;
const SEARCH = /*__SEARCH__*/;
const ORDER = /*__ORDER__*/;
const byId = Object.fromEntries(META.map(m => [m.id, m]));
const CODES = META.filter(m => m.kind === "code");
const $ = id => document.getElementById(id);
const nav = $("nav"), main = $("main"), pager = $("pager"), input = $("search-input");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* 记住上次读到的页面和滚动位置（刷新、或从不带 # 的地址打开时恢复）。存储不可用时静默跳过 */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("llmbook:" + k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("llmbook:" + k, JSON.stringify(v)); } catch (e) {} },
};

/* 地址：#ch1 是第 1 章，#ch1/1.3 是第 1 章 1.3 节 */
function parse() {
  const [p, sec] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (byId[p] && byId[p].kind !== "planned") return { page: p, sec: sec || null, explicit: true };
  if (p) return { page: "home", sec: null, explicit: true };
  const last = store.get("last");
  return { page: last && byId[last] ? last : "home", sec: null, explicit: false };
}
let current = null;

/* ---------- 侧栏 ---------- */
const open = new Set();
function chapterOf(id) { return byId[id].kind === "code" ? "code" : id; }
function buildNav() {
  let h = `<a class="nav-top" href="#home" data-id="home">封面与目录</a>`;
  for (const part of NAV) {
    h += `<p class="part-label">${esc(part.part)}</p>`;
    for (const id of part.items) h += chapterHtml(byId[id]);
    if (part.part === "附录") h += codeHtml();
  }
  nav.innerHTML = h;
  markNav();
}
function chapterHtml(m) {
  if (m.kind === "planned")
    return `<div class="chap planned"><div class="chap-row"><span class="chap-link"><span class="chap-num">${m.num}</span>${esc(m.title)}<span class="soon">待写</span></span></div></div>`;
  const secs = m.sections.map(s => `<li><a class="sec-link" href="#${m.id}/${s.id}" data-page="${m.id}" data-sec="${s.id}"><span class="sec-num">${s.id}</span><span>${esc(s.title)}</span></a></li>`).join("");
  return `<div class="chap" data-chap="${m.id}"><div class="chap-row"><a class="chap-link" href="#${m.id}"><span class="chap-num">${m.num}</span><span>${esc(m.title)}</span></a>` +
    `<button class="chap-toggle" type="button" aria-label="展开或收起${esc(m.label)}的小节"></button></div><ul class="secs">${secs}</ul></div>`;
}
function codeHtml() {
  const items = CODES.map(c => `<li><a class="sec-link code" href="#${c.id}" data-page="${c.id}">${esc(c.title)}</a></li>`).join("");
  return `<div class="chap" data-chap="code"><div class="chap-row"><a class="chap-link" href="#${CODES[0].id}"><span class="chap-num">B</span><span>代码</span></a>` +
    `<button class="chap-toggle" type="button" aria-label="展开或收起代码列表"></button></div><ul class="secs">${items}</ul></div>`;
}
function markNav() {
  const cur = current ? chapterOf(current) : null;
  nav.querySelectorAll(".chap[data-chap]").forEach(el => {
    const c = el.dataset.chap;
    el.classList.toggle("current", c === cur);
    el.classList.toggle("open", open.has(c));
    const btn = el.querySelector(".chap-toggle"); if (btn) btn.setAttribute("aria-expanded", open.has(c));
  });
  nav.querySelectorAll(".nav-top").forEach(a => a.toggleAttribute("aria-current", current === "home"));
  nav.querySelectorAll(".sec-link.code").forEach(a => a.classList.toggle("active", a.dataset.page === current));
}
nav.addEventListener("click", e => {
  const t = e.target.closest(".chap-toggle");
  if (t) {
    const c = t.closest(".chap").dataset.chap;
    open.has(c) ? open.delete(c) : open.add(c);
    markNav(); return;
  }
  if (e.target.closest(".result")) { input.value = ""; setTimeout(buildNav, 0); }
});

/* ---------- 显示页面、定位到节 ---------- */
function offsetIn(el) { return el.getBoundingClientRect().top - main.getBoundingClientRect().top + main.scrollTop; }
function route() {
  const { page, sec, explicit } = parse();
  const changed = page !== current;
  if (changed) {
    document.querySelectorAll("article.doc").forEach(a => a.hidden = a.dataset.page !== page);
    current = page;
    open.clear(); open.add(chapterOf(page));   // 换章时只展开当前这一章
    buildPager(page);
    document.title = page === "home" ? "大模型原理" : `${byId[page].label} ${byId[page].title} · 大模型原理`;
    store.set("last", page);
    document.body.classList.remove("nav-open");
  }
  markNav();
  if (changed) { const cur = nav.querySelector(".chap.current"); if (cur) cur.scrollIntoView({ block: "nearest" }); }
  const target = sec && document.getElementById(`${page}--${sec}`);
  if (target) main.scrollTop = offsetIn(target) - 24;
  else if (changed) {
    const pos = store.get("pos") || {};
    main.scrollTop = !explicit || restoring ? (pos[page] || 0) : 0;
  }
  restoring = false;
  spy();
}
let restoring = true;

/* 滚动时高亮侧栏里当前所在的节，并记住位置 */
let saveTimer = 0;
function spy() {
  const art = $("page-" + current); if (!art) return;
  let k = null;
  for (const h of art.querySelectorAll(".prose h2[id]")) { if (offsetIn(h) - main.scrollTop <= 120) k = h.id.split("--")[1]; else break; }
  nav.querySelectorAll(".sec-link[data-sec]").forEach(a => a.classList.toggle("active", a.dataset.page === current && a.dataset.sec === k));
}
main.addEventListener("scroll", () => {
  spy();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { const pos = store.get("pos") || {}; pos[current] = Math.round(main.scrollTop); store.set("pos", pos); }, 250);
}, { passive: true });

/* ---------- 上一章 / 下一章 ---------- */
function buildPager(id) {
  const i = ORDER.indexOf(id);
  if (i < 0) { pager.innerHTML = ""; return; }
  const name = p => p === "home" ? "封面与目录" : `${byId[p].label} ${byId[p].title}`;
  const p = ORDER[i - 1], n = ORDER[i + 1];
  pager.innerHTML =
    (p ? `<a class="prev" href="#${p}"><small>上一章</small><b>${esc(name(p))}</b></a>` : "") +
    (n ? `<a class="next" href="#${n}"><small>下一章</small><b>${esc(name(n))}</b></a>` : "");
}

/* ---------- 全文搜索：结果显示在侧栏 ---------- */
function search(q) {
  q = q.trim();
  if (!q) { buildNav(); return; }
  const ql = q.toLowerCase(), hits = [];
  for (const s of SEARCH) {
    const t = s.text, tl = t.toLowerCase();
    let n = 0, pos = tl.indexOf(ql); const first = pos;
    while (pos >= 0) { n++; pos = tl.indexOf(ql, pos + ql.length); }
    const m = byId[s.id], inTitle = m.title.toLowerCase().includes(ql);
    if (n || inTitle) hits.push({ id: s.id, n, inTitle, first, t });
  }
  hits.sort((a, b) => (b.inTitle - a.inTitle) || (b.n - a.n));
  nav.innerHTML = `<p class="part-label">${hits.length ? "找到 " + hits.length + " 处" : "没有找到"}</p>` +
    hits.map(h => {
      const m = byId[h.id];
      let snip = "";
      if (h.first >= 0) {
        const a = Math.max(0, h.first - 24);
        snip = "…" + esc(h.t.slice(a, h.first)) + "<mark>" + esc(h.t.slice(h.first, h.first + q.length)) + "</mark>" + esc(h.t.slice(h.first + q.length, h.first + q.length + 40)) + "…";
      }
      return `<a class="result" href="#${h.id}"><b>${esc(m.label ? m.label + " " + m.title : m.title)}</b>${h.n ? h.n + " 处 · " : ""}${snip}</a>`;
    }).join("");
}
input.addEventListener("input", () => search(input.value));

$("menu-btn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
document.addEventListener("click", e => { if (document.body.classList.contains("nav-open") && !e.target.closest(".side") && !e.target.closest("#menu-btn")) document.body.classList.remove("nav-open"); });
window.addEventListener("hashchange", route);
buildNav();
route();
</script>
</body>
