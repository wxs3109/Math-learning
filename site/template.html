<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math learning 笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>/*__KATEX_CSS__*/</style>
<style>
/* 版式：左侧深色导航栏 | 正文一栏（约 40 个汉字宽）| 右侧本页目录。唯一的强调：二级标题前的朱红"印章"编号 */
:root {
  --paper: #fbfbfa;        /* 正文底色 */
  --ink: #161c28;          /* 正文 */
  --muted: #586172;        /* 次要文字 */
  --rule: #e2e4e8;         /* 分隔线、边框 */
  --wash: #f1f2f4;         /* 行内代码、表头、引用 */
  --panel: #111a2b;        /* 侧栏、代码块 */
  --accent: #cf3b25;       /* 朱红 */
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --panel-ink: #c9d1de; --panel-muted: #7b879b; --panel-hover: #1b2639; --panel-rule: #243049;
  --callout: #fff5dc; --callout-bar: #d99a0b;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e131c; --ink: #e4e7ed; --muted: #9ba4b4; --rule: #252d3a; --wash: #171e2a;
    --panel: #090d15; --accent: #ff6a50; --panel-hover: #141c2a; --panel-rule: #1c2536;
    --callout: #2b2312; --callout-bar: #d99a0b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e131c; --ink: #e4e7ed; --muted: #9ba4b4; --rule: #252d3a; --wash: #171e2a;
  --panel: #090d15; --accent: #ff6a50; --panel-hover: #141c2a; --panel-rule: #1c2536;
  --callout: #2b2312; --callout-bar: #d99a0b;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.8; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.shell { display: grid; grid-template-columns: 284px minmax(0, 1fr); height: 100%; }

/* ---------------- 侧栏 ---------------- */
.side { background: var(--panel); color: var(--panel-ink); display: flex; flex-direction: column; min-height: 0; }
.brand { display: block; padding: 26px 24px 18px; color: #fff; }
.brand:hover { text-decoration: none; }
.brand b { display: block; font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: .01em; line-height: 1.2; }
.brand span { font-size: 12.5px; color: var(--panel-muted); }
.search { padding: 0 18px 14px; }
.search input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--panel-rule); background: var(--panel-hover); color: #fff; font: inherit; font-size: 14px; }
.search input::placeholder { color: var(--panel-muted); }
.nav { overflow-y: auto; padding: 4px 12px 32px; flex: 1; }
.nav-group { margin-top: 18px; }
.nav-label, .nav-group summary { display: block; padding: 0 12px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .14em; color: var(--panel-muted); }
.nav-group summary { cursor: pointer; list-style: none; }
.nav-group summary::-webkit-details-marker { display: none; }
.nav-group summary::after { content: " +"; }
.nav-group details[open] summary::after { content: " −"; }
.nav-link { display: block; padding: 6px 12px; border-radius: 7px; color: var(--panel-ink); font-size: 14.5px; line-height: 1.45; }
.nav-link:hover { background: var(--panel-hover); text-decoration: none; color: #fff; }
.nav-link[aria-current="page"] { background: var(--panel-hover); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.nav-link.code { font-family: var(--font-mono); font-size: 12.5px; }
.result { display: block; padding: 9px 12px; border-radius: 7px; color: var(--panel-ink); font-size: 13px; line-height: 1.55; }
.result:hover { background: var(--panel-hover); text-decoration: none; }
.result b { display: block; color: #fff; font-weight: 500; font-size: 14px; }
.result mark { background: var(--accent); color: #fff; padding: 0 2px; border-radius: 2px; }

/* ---------------- 主区 ---------------- */
.main { overflow-y: auto; min-height: 0; }
.mobile-bar { display: none; }
.layout { display: grid; grid-template-columns: minmax(0, 44rem) 13.5rem; gap: 56px; justify-content: center; padding: 56px 40px 120px; }
.toc { position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 112px); overflow-y: auto; font-size: 13px; line-height: 1.5; }
.toc-label { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; color: var(--muted); margin: 0 0 10px; }
.toc a { display: block; padding: 4px 0 4px 12px; color: var(--muted); border-left: 2px solid var(--rule); }
.toc a.l3 { padding-left: 24px; font-size: 12.5px; }
.toc a:hover { color: var(--ink); text-decoration: none; }
.toc a.active { color: var(--accent); border-left-color: var(--accent); }

/* ---------------- 页头 ---------------- */
.eyebrow { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .14em; color: var(--accent); }
.page-head { padding-bottom: 28px; margin-bottom: 8px; border-bottom: 1px solid var(--rule); }
.page-head h1 { font-family: var(--font-display); font-weight: 900; font-size: 40px; line-height: 1.22; margin: 0 0 14px; text-wrap: balance; letter-spacing: .01em; }
.page-head h1 code { font-family: var(--font-mono); font-weight: 500; font-size: 32px; }
.dek { font-size: 18px; line-height: 1.7; color: var(--muted); margin: 0 0 14px; max-width: 38em; }
.meta-line { margin: 2px 0; font-size: 13px; color: var(--muted); }
.meta-line .tag { margin-left: 0; margin-right: 2px; }

/* ---------------- 正文 ---------------- */
.prose { font-size: 16.5px; }
.prose p { margin: 0 0 16px; text-wrap: pretty; }
.prose h2 { display: flex; align-items: center; gap: 14px; margin: 64px 0 20px; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.35; text-wrap: balance; }
.prose h2:first-child { margin-top: 36px; }
.secnum { flex: none; display: inline-grid; place-items: center; min-width: 34px; height: 34px; padding: 0 6px; border-radius: 6px; background: var(--accent); color: #fff; font-family: var(--font-display); font-size: 18px; font-weight: 900; }
.prose h3 { margin: 40px 0 12px; font-family: var(--font-display); font-weight: 700; font-size: 19.5px; line-height: 1.45; text-wrap: balance; }
.subnum { font-family: var(--font-mono); font-weight: 500; font-size: 14px; color: var(--accent); margin-right: 10px; }
.prose ul, .prose ol { margin: 0 0 16px; padding-left: 1.5em; }
.prose li { margin: 4px 0; }
.prose li > p { margin: 0 0 6px; }
.prose ul > li::marker { color: var(--accent); }
.prose ol > li::marker { color: var(--muted); font-weight: 500; }
.prose strong { font-weight: 700; }
.prose blockquote { margin: 20px 0; padding: 14px 18px; background: var(--wash); border-radius: 10px; color: var(--muted); font-size: 15px; }
.prose blockquote p:last-child { margin-bottom: 0; }
.prose blockquote.callout { background: var(--callout); color: var(--ink); box-shadow: inset 3px 0 0 var(--callout-bar); }
.prose blockquote.callout::before { content: "更正"; display: block; font-size: 12px; font-weight: 700; letter-spacing: .14em; color: var(--callout-bar); margin-bottom: 4px; }
.prose code { font-family: var(--font-mono); font-size: .86em; background: var(--wash); padding: 1px 6px; border-radius: 5px; }
.prose a code { color: var(--accent); }

.tag { display: inline-block; margin-left: 8px; padding: 1px 9px; border-radius: 999px; font-family: var(--font-body); font-size: 12px; font-weight: 500; line-height: 1.7; vertical-align: 3px; letter-spacing: .02em; white-space: nowrap; }
.tag-proved { background: #e3f3e7; color: #1d6a38; }
.tag-fact { background: #e6edf8; color: #2b4e86; }
.tag-intuition { background: #fdf1d3; color: #855700; }
.tag-conjecture { background: #efe6fa; color: #66399c; }
.tag-verify { background: #fbe4df; color: #a2311d; }
.tag-numeric { background: #def2f1; color: #1b6767; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag { background: rgba(255,255,255,.08); color: var(--ink); } }
:root[data-theme="dark"] .tag { background: rgba(255,255,255,.08); color: var(--ink); }

.katex { font-size: 1.07em; }
.katex-display { margin: 22px 0; padding: 4px 0; overflow-x: auto; overflow-y: hidden; }
.math-error { color: var(--accent); }
.nobr { white-space: nowrap; }

.table-wrap { margin: 20px 0 24px; overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; }
.prose table { border-collapse: collapse; width: 100%; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.prose th { background: var(--wash); text-align: left; font-size: 13px; font-weight: 700; color: var(--muted); padding: 10px 14px; white-space: nowrap; }
.prose td { padding: 9px 14px; border-top: 1px solid var(--rule); vertical-align: top; }

.prose pre { position: relative; margin: 20px 0 24px; padding: 40px 22px 20px; background: var(--panel); color: #d9e1ee; border-radius: 12px; overflow-x: auto; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.65; }
.prose pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
.pre-label { position: absolute; top: 12px; left: 22px; font-size: 11.5px; letter-spacing: .08em; color: var(--panel-muted); font-family: var(--font-mono); }
/* Pygments 配色（代码块总是深色底） */
.code .k, .code .kn, .code .kd, .code .kc, .code .kr, .code .ow { color: #ff9b80; }
.code .s, .code .s1, .code .s2, .code .sa, .code .se, .code .si { color: #a9d8a2; }
.code .sd { color: #8fbf89; }
.code .c, .code .c1, .code .cm, .code .ch { color: #6f7d95; font-style: italic; }
.code .m, .code .mi, .code .mf { color: #f3c47a; }
.code .nf, .code .fm, .code .nc { color: #8cb6f5; }
.code .nb, .code .bp { color: #c6a8fa; }
.code .o { color: #b9c3d3; }

/* ---------------- 上一篇 / 下一篇 ---------------- */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 72px; }
.pager:empty { display: none; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; border: 1px solid var(--rule); border-radius: 12px; color: var(--ink); }
.pager a:hover { border-color: var(--accent); text-decoration: none; }
.pager small { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.pager b { font-family: var(--font-display); font-size: 17px; }
.pager .next { grid-column: 2; text-align: right; }

/* ---------------- 首页 ---------------- */
.hero { padding: 24px 0 44px; border-bottom: 1px solid var(--rule); }
.hero h1 { font-family: var(--font-display); font-weight: 900; font-size: 64px; line-height: 1.05; margin: 0 0 20px; letter-spacing: -.01em; }
.hero .dek { font-size: 18.5px; }
.track { padding: 44px 0 8px; }
.track-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.track-head h2 { font-family: var(--font-display); font-size: 24px; font-weight: 700; margin: 0; }
.track-head a { font-size: 14px; white-space: nowrap; }
.track-dek { color: var(--muted); margin: 6px 0 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 14px; }
.cards-2 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card { display: flex; flex-direction: column; gap: 6px; padding: 18px 18px 16px; border: 1px solid var(--rule); border-radius: 14px; color: var(--ink); background: var(--paper); transition: border-color .15s, transform .15s; }
a.card:hover { border-color: var(--accent); transform: translateY(-2px); text-decoration: none; }
.card-num { font-family: var(--font-mono); font-size: 13px; color: var(--accent); }
.card-title { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.35; }
.card-dek { font-size: 13.5px; color: var(--muted); line-height: 1.6; flex: 1; }
.status { align-self: flex-start; margin-top: 6px; font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--wash); color: var(--muted); }
.status-done { background: #e3f3e7; color: #1d6a38; }
.status-active { background: var(--accent); color: #fff; }
.card-planned { border-style: dashed; background: transparent; }
.card-planned .card-title, .card-planned .card-num { color: var(--muted); }

/* ---------------- 窄屏 ---------------- */
@media (max-width: 1240px) { .layout { grid-template-columns: minmax(0, 44rem); } .toc { display: none; } }
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; inset: 0 auto 0 0; width: 86%; max-width: 320px; z-index: 10; transform: translateX(-100%); transition: transform .2s; }
  body.nav-open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); }
  .mobile-bar { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; padding: 10px 16px; background: var(--panel); color: #fff; }
  .mobile-bar button { border: 1px solid var(--panel-rule); background: var(--panel-hover); color: #fff; border-radius: 7px; padding: 4px 12px; font: inherit; font-size: 14px; }
  .mobile-bar b { font-family: var(--font-display); font-weight: 900; }
  .layout { padding: 28px 18px 80px; }
  .page-head h1 { font-size: 30px; }
  .hero h1 { font-size: 44px; }
  .prose h2 { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .side, .card { transition: none; } a.card:hover { transform: none; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="站点导航">
    <a class="brand" href="#home"><b>Math learning</b><span>学习与研究笔记</span></a>
    <div class="search"><input id="search-input" type="search" placeholder="搜索笔记和代码" aria-label="搜索笔记和代码" autocomplete="off"></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main" id="main">
    <div class="mobile-bar"><button type="button" id="menu-btn">目录</button><b>Math learning</b></div>
    <div class="layout">
      <div>
<!--__ARTICLES__-->
        <nav class="pager" id="pager" aria-label="上一篇和下一篇"></nav>
      </div>
      <aside class="toc" id="toc" aria-label="本页目录"></aside>
    </div>
  </div>
</div>
<script>
const META = /*__META__*/;
const SEARCH = /*__SEARCH__*/;
const SERIES = /*__SERIES__*/;
const byId = Object.fromEntries(META.map(m => [m.id, m]));
const $ = id => document.getElementById(id);
const nav = $("nav"), main = $("main"), toc = $("toc"), pager = $("pager"), input = $("search-input");
let heads = [];

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function current() { const h = location.hash.slice(1); return byId[h] ? h : "home"; }

/* 侧栏导航：按分组列出页面，代码收进可展开的一组 */
function buildNav() {
  const groups = [];
  for (const m of META) {
    if (m.id === "home") continue;
    let g = groups.find(x => x.name === m.group);
    if (!g) groups.push(g = { name: m.group, items: [] });
    g.items.push(m);
  }
  nav.innerHTML = groups.map(g => {
    const links = g.items.map(m => `<a class="nav-link${g.name === "代码" ? " code" : ""}" href="#${m.id}" data-id="${m.id}">${esc(m.short)}</a>`).join("");
    return g.name === "代码"
      ? `<div class="nav-group"><details id="code-group"><summary>代码 · ${g.items.length}</summary>${links}</details></div>`
      : `<div class="nav-group"><span class="nav-label">${esc(g.name)}</span>${links}</div>`;
  }).join("");
  markActive(current());
}
function markActive(id) {
  nav.querySelectorAll(".nav-link").forEach(a => a.dataset.id === id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const cg = $("code-group"); if (cg && byId[id].group === "代码") cg.open = true;
}

/* 切换页面 */
function show(id) {
  document.querySelectorAll("article.doc").forEach(a => a.hidden = a.dataset.page !== id);
  markActive(id);
  buildToc(id);
  buildPager(id);
  document.title = (id === "home" ? "Math learning 笔记" : byId[id].short + " · Math learning");
  main.scrollTop = 0;
  document.body.classList.remove("nav-open");
}

/* 本页目录：点击滚动到标题；滚动时高亮当前小节 */
function buildToc(id) {
  const art = $("page-" + id);
  heads = [...art.querySelectorAll(".prose h2, .prose h3")];
  const labels = byId[id].toc || [];
  if (heads.length < 3) { toc.innerHTML = ""; return; }
  toc.innerHTML = '<p class="toc-label">本页目录</p>' + heads.map((h, i) => {
    const t = labels.length === heads.length ? labels[i].text : h.textContent;
    return `<a href="#${id}" class="l${h.tagName[1]}" data-i="${i}">${esc(t)}</a>`;
  }).join("");
  spy();
}
toc.addEventListener("click", e => {
  const a = e.target.closest("a"); if (!a) return;
  e.preventDefault();
  main.scrollTo({ top: heads[+a.dataset.i].offsetTop - 24 });
});
function spy() {
  let k = 0;
  heads.forEach((h, i) => { if (h.offsetTop - 120 <= main.scrollTop) k = i; });
  toc.querySelectorAll("a").forEach((a, i) => a.classList.toggle("active", i === k));
}
main.addEventListener("scroll", spy, { passive: true });

/* 上一篇 / 下一篇（大模型系列） */
function buildPager(id) {
  const i = SERIES.indexOf(id);
  if (i < 0) { pager.innerHTML = ""; return; }
  const p = SERIES[i - 1], n = SERIES[i + 1];
  pager.innerHTML =
    (p ? `<a class="prev" href="#${p}"><small>上一篇</small><b>${esc(byId[p].short)}</b></a>` : "") +
    (n ? `<a class="next" href="#${n}"><small>下一篇</small><b>${esc(byId[n].short)}</b></a>` : "");
}

/* 全文搜索：结果显示在侧栏 */
function search(q) {
  q = q.trim();
  if (!q) { buildNav(); return; }
  const ql = q.toLowerCase(), hits = [];
  for (const s of SEARCH) {
    const t = s.text, tl = t.toLowerCase();
    let n = 0, pos = tl.indexOf(ql); const first = pos;
    while (pos >= 0) { n++; pos = tl.indexOf(ql, pos + ql.length); }
    const inTitle = byId[s.id].short.toLowerCase().includes(ql);
    if (n || inTitle) hits.push({ id: s.id, n, inTitle, first, t });
  }
  hits.sort((a, b) => (b.inTitle - a.inTitle) || (b.n - a.n));
  nav.innerHTML = `<div class="nav-group"><span class="nav-label">${hits.length ? "找到 " + hits.length + " 个页面" : "没有找到"}</span>` +
    hits.map(h => {
      let snip = "";
      if (h.first >= 0) {
        const a = Math.max(0, h.first - 24);
        snip = "…" + esc(h.t.slice(a, h.first)) + "<mark>" + esc(h.t.slice(h.first, h.first + q.length)) + "</mark>" + esc(h.t.slice(h.first + q.length, h.first + q.length + 40)) + "…";
      }
      return `<a class="result" href="#${h.id}"><b>${esc(byId[h.id].short)}</b>${h.n ? h.n + " 处 · " : ""}${snip}</a>`;
    }).join("") + "</div>";
}
input.addEventListener("input", () => search(input.value));
nav.addEventListener("click", e => { if (e.target.closest(".result")) { input.value = ""; setTimeout(buildNav, 0); } });

$("menu-btn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
document.addEventListener("click", e => { if (document.body.classList.contains("nav-open") && !e.target.closest(".side") && !e.target.closest("#menu-btn")) document.body.classList.remove("nav-open"); });
window.addEventListener("hashchange", () => show(current()));
buildNav();
show(current());
</script>
</body>
</html>
