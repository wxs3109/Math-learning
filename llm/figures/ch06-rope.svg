<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img">
<style>
.bg{fill:var(--paper,#fbfbfa)}
.t{fill:var(--ink,#161c28);font-family:var(--font-body,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif)}
.mu{fill:var(--muted,#586172)}
.ln{stroke:var(--muted,#586172);fill:none;stroke-width:1.4}
.lnb{stroke:var(--ink,#161c28);fill:none;stroke-width:3}
.box{fill:var(--wash,#f1f2f4);stroke:var(--rule,#c9cdd4);stroke-width:1}
.frame{fill:none;stroke:var(--rule,#c9cdd4);stroke-width:1}
.q{fill:#cf3b25}.qs{stroke:#cf3b25}
.k{fill:#d99a0b}.ks{stroke:#d99a0b}
.v{fill:#2f6fb5}.vs{stroke:#2f6fb5}
.acc{fill:var(--accent,#cf3b25)}
.mask{fill:var(--rule,#d5d8dd)}
.wh{fill:#ffffff}
</style>
<defs><marker id="ah-ch06-rope" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mu"/></marker></defs>
<rect width="100%" height="100%" class="bg"/>
<circle cx="190" cy="180" r="105" class="frame" style="stroke-dasharray:3 4"/>
<line x1="73.0" y1="180.0" x2="307.0" y2="180.0" class="ln" opacity="0.4"/>
<line x1="190.0" y1="297.0" x2="190.0" y2="63.0" class="ln" opacity="0.4"/>
<line x1="190" y1="180" x2="246.9" y2="170.0" class="qs" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
<line x1="190" y1="180" x2="234.2" y2="142.9" class="ks" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
<line x1="190" y1="180" x2="269.1" y2="124.6" class="qs" stroke-width="3" marker-end="url(#ah-ch06-rope)"/>
<text x="283.9" y="119.3" font-size="13" text-anchor="middle" class="t" font-weight="bold" >q 转 1θ</text>
<line x1="190" y1="180" x2="149.2" y2="92.5" class="ks" stroke-width="3" marker-end="url(#ah-ch06-rope)"/>
<text x="141.6" y="81.1" font-size="13" text-anchor="middle" class="t" font-weight="bold" >k 转 3θ</text>
<path d="M221.1,158.2 A38,38 0 0 0 173.9,145.6" class="ln" stroke-width="2"/>
<text x="190.0" y="306.0" font-size="13" text-anchor="middle" class="t" font-weight="bold" >query 在位置 m = 1，key 在位置 n = 3</text>
<circle cx="570" cy="180" r="105" class="frame" style="stroke-dasharray:3 4"/>
<line x1="453.0" y1="180.0" x2="687.0" y2="180.0" class="ln" opacity="0.4"/>
<line x1="570.0" y1="297.0" x2="570.0" y2="63.0" class="ln" opacity="0.4"/>
<line x1="570" y1="180" x2="626.9" y2="170.0" class="qs" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
<line x1="570" y1="180" x2="614.2" y2="142.9" class="ks" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>
<line x1="570" y1="180" x2="537.0" y2="89.2" class="qs" stroke-width="3" marker-end="url(#ah-ch06-rope)"/>
<text x="530.8" y="77.3" font-size="13" text-anchor="middle" class="t" font-weight="bold" >q 转 4θ</text>
<line x1="570" y1="180" x2="474.9" y2="196.8" class="ks" stroke-width="3" marker-end="url(#ah-ch06-rope)"/>
<text x="457.1" y="204.9" font-size="13" text-anchor="middle" class="t" font-weight="bold" >k 转 6θ</text>
<path d="M557.0,144.3 A38,38 0 0 0 532.6,186.6" class="ln" stroke-width="2"/>
<text x="570.0" y="306.0" font-size="13" text-anchor="middle" class="t" font-weight="bold" >query 在位置 m = 4，key 在位置 n = 6</text>
<text x="380.0" y="30.0" font-size="14" text-anchor="middle" class="t" font-weight="bold" >两个例子绝对位置不同，但 n − m 都是 2：转完之后 q、k 的夹角一样，内积也一样</text>
<text x="380.0" y="52.0" font-size="12" text-anchor="middle" class="t mu" >虚线是旋转前的 q、k；实线是旋转后的。夹角 = 原来的夹角 + (n − m)θ</text>
<text x="380.0" y="332.0" font-size="12" text-anchor="middle" class="t mu" >真实的 RoPE 把每个 head 的向量分成很多对，每一对用不同的频率 θ<tspan baseline-shift="sub" font-size="75%">i</tspan> 各自旋转。</text>
</svg>
