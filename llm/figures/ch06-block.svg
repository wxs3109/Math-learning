<path d="M400,256 L540,256 L540,234" class="ln" marker-end="url(#ah-ch06-block)" />
<rect x="470.0" y="204.0" width="140.0" height="30.0" rx="5" class="box" />
<text x="540.0" y="224.0" font-size="12" text-anchor="middle" class="t" >归一化（RMSNorm）</text>
<line x1="540.0" y1="204.0" x2="540.0" y2="184.0" class="ln" marker-end="url(#ah-ch06-block)" />
<rect x="470.0" y="142.0" width="140.0" height="42.0" rx="6" class="q" opacity="0.85"/>
<text x="540.0" y="168.0" font-size="13" text-anchor="middle" class="t wh" font-weight="bold" >FFN（SwiGLU）</text>
<path d="M540,142 L540,110 L414,110" class="ln" marker-end="url(#ah-ch06-block)" />
<circle cx="400" cy="110" r="12" class="box" style="stroke:var(--ink,#161c28);stroke-width:1.6"/>
<text x="400.0" y="116.0" font-size="18" text-anchor="middle" class="t" font-weight="bold" >+</text>
<text x="620.0" y="160.0" font-size="12" text-anchor="start" class="t mu" >每个位置</text>
<text x="620.0" y="176.0" font-size="12" text-anchor="start" class="t mu" >单独加工</text>
<text x="535.0" y="470.0" font-size="11" text-anchor="middle" class="t mu" >Pre-Norm：归一化只在分支里，</text>
<text x="535.0" y="486.0" font-size="11" text-anchor="middle" class="t mu" >主干上的 X 从输入一路加到输出</text>
